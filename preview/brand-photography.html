<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #181A21; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }
  .img-card { border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 4/3; }
  img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
  .cap { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(24,26,33,0.85)); padding: 6px 8px; font-size: 10px; color: rgba(255,255,255,0.75); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="grid">
  <div class="img-card"><img src="../assets/facility-commons.webp" alt="Commons"><div class="cap">Commons / Great Room</div></div>
  <div class="img-card"><img src="../assets/facility-reception.webp" alt="Reception"><div class="cap">Reception Desk</div></div>
  <div class="img-card"><img src="../assets/facility-lobby-logo.webp" alt="Lobby Logo"><div class="cap">Lobby Logo Wall</div></div>
  <div class="img-card"><img src="../assets/facility-bedroom.webp" alt="Bedroom"><div class="cap">Client Bedroom</div></div>
  <div class="img-card"><img src="../assets/facility-entrance.webp" alt="Entrance"><div class="cap">Entry Foyer</div></div>
  <div class="img-card"><img src="../assets/facility-therapy-office.webp" alt="Therapy"><div class="cap">Therapy Office</div></div>
  <div class="img-card"><img src="../assets/team-group.webp" alt="Team"><div class="cap">Staff Team</div></div>
  <div class="img-card"><img src="../assets/team-with-dog.webp" alt="With dog"><div class="cap">Therapy Dogs</div></div>
</div>
</body>
</html>
