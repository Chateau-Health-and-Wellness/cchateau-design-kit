<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-warm); margin: 0; padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .dark-row { background: var(--brand-primary); padding: 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .img-row { background: #181A21; padding: 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  label { font-family: Arial, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--neutral-500); width: 100%; margin-bottom: -4px; }
  .note { font-family: Arial, sans-serif; font-size: 10px; color: var(--neutral-500); font-style: italic; margin-left: 4px; }
  .divider { height: 1px; background: var(--neutral-300); margin: 14px 0; }
  /* All buttons inherit .btn defaults (padding 14px 32px, 16px font) — clears 44×44 touch target. */
</style>
</head>
<body>

  <div class="row">
    <label>Primary CTA — Steel Blue <span class="note">(default large fill, on light bg)</span></label>
    <a class="btn btn-primary">Get Help Now</a>
  </div>

  <!-- Orange-filled CTA (.btn-accent) RETIRED. See --accent canonical comment in colors_and_type.css. -->

  <div class="row">
    <label>Secondary — Steel Blue Outlined</label>
    <a class="btn btn-secondary">Explore Programs</a>
  </div>

  <div class="row">
    <label>Outline Accent — Teal <span class="note">(verify insurance, low-emphasis)</span></label>
    <a class="btn btn-outline-accent">Verify Insurance</a>
  </div>

  <div class="divider"></div>

  <div class="dark-row">
    <label style="color:rgba(255,255,255,0.4)">On Dark (nav, footer) — white fill replaces steel-blue-on-dark which fails contrast</label>
    <a class="btn btn-on-dark">Get Help Now</a>
    <a class="btn btn-ghost">Verify Insurance</a>
  </div>

  <div class="img-row">
    <label style="color:rgba(255,255,255,0.4)">On Image (hero, spotlight) — cinematic bg</label>
    <a class="btn btn-primary">Get Help Now</a>
    <a class="btn btn-ghost">Verify Insurance</a>
  </div>

</body>
</html>
