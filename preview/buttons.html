<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-warm); margin: 0; padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .dark-row { background: var(--brand-primary); padding: 14px 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .img-row { background: #181A21; padding: 14px 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  label { font-family: Arial, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--neutral-500); width: 100%; margin-bottom: -4px; }
  .note { font-family: Arial, sans-serif; font-size: 10px; color: var(--neutral-500); font-style: italic; margin-left: 4px; }
  .btn { padding: 12px 24px; font-size: 14px; }
  .btn-sm { padding: 8px 18px; font-size: 12px; }
  .divider { height: 1px; background: var(--neutral-300); margin: 14px 0; }
</style>
</head>
<body>

  <div class="row">
    <label>Primary CTA — Steel Blue <span class="note">(default large fill)</span></label>
    <a class="btn btn-primary">Get Help Now</a>
    <a class="btn btn-primary btn-sm">Get Help Now</a>
  </div>

  <div class="row">
    <label>Accent CTA — Burnt Orange <span class="note">(sparing — one per section max)</span></label>
    <a class="btn btn-accent">Get Help Now</a>
    <a class="btn btn-accent btn-sm">Get Help Now</a>
  </div>

  <div class="divider"></div>

  <div class="row">
    <label>Secondary — Steel Blue Outlined</label>
    <a class="btn btn-secondary">Explore Programs</a>
  </div>

  <div class="row">
    <label>Outline Accent — Teal <span class="note">(verify insurance, low-emphasis)</span></label>
    <a class="btn btn-outline-accent">Verify Insurance</a>
  </div>

  <div class="divider"></div>

  <div class="dark-row">
    <label style="color:rgba(255,255,255,0.4)">On Dark (nav, footer)</label>
    <a class="btn btn-primary" style="font-size:14px;padding:12px 24px;">Get Help Now</a>
    <a class="btn btn-ghost" style="font-size:14px;padding:12px 24px;">Verify Insurance</a>
  </div>

  <div class="img-row">
    <label style="color:rgba(255,255,255,0.4)">On Image (hero, spotlight) — cinematic bg</label>
    <a class="btn btn-primary" style="font-size:14px;padding:12px 24px;">Get Help Now</a>
    <a class="btn btn-ghost" style="font-size:14px;padding:12px 24px;">Verify Insurance</a>
  </div>

</body>
</html>
