<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-warm); margin: 0; padding: 20px; font-family: Arial, sans-serif; }
  h3 { font-size: 10px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--neutral-500); margin: 0 0 10px; }
  .space-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .bar { background: var(--brand-secondary); border-radius: 2px; height: 12px; }
  .lbl { font-size: 10px; color: var(--neutral-700); font-family: monospace; width: 110px; flex-shrink: 0; }
  .sep { height: 1px; background: var(--neutral-300); margin: 12px 0; }
  .radius-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .r-chip { background: var(--brand-primary); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .r-lbl { font-size: 9px; color: white; font-family: monospace; }
  .shadow-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .s-card { background: white; width: 80px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 9px; color: var(--neutral-500); font-family: monospace; }
</style>
</head>
<body>
<h3>Space Scale</h3>
<div class="space-row"><span class="lbl">--space-2 · 8px</span><div class="bar" style="width:8px;"></div></div>
<div class="space-row"><span class="lbl">--space-4 · 16px</span><div class="bar" style="width:16px;"></div></div>
<div class="space-row"><span class="lbl">--space-6 · 24px</span><div class="bar" style="width:24px;"></div></div>
<div class="space-row"><span class="lbl">--space-8 · 32px</span><div class="bar" style="width:32px;"></div></div>
<div class="space-row"><span class="lbl">--space-12 · 48px</span><div class="bar" style="width:48px;"></div></div>
<div class="space-row"><span class="lbl">--space-16 · 64px</span><div class="bar" style="width:64px;"></div></div>
<div class="space-row"><span class="lbl">--space-20 · 80px</span><div class="bar" style="width:80px;"></div></div>
<div class="sep"></div>
<h3>Border Radius</h3>
<div class="radius-row">
  <div><div class="r-chip" style="border-radius:4px;"><span class="r-lbl">sm·4</span></div></div>
  <div><div class="r-chip" style="border-radius:8px;"><span class="r-lbl">md·8</span></div></div>
  <div><div class="r-chip" style="border-radius:12px;"><span class="r-lbl">lg·12</span></div></div>
  <div><div class="r-chip" style="border-radius:9999px; width:80px;"><span class="r-lbl">pill</span></div></div>
</div>
<div class="sep"></div>
<h3>Shadows</h3>
<div class="shadow-row">
  <div class="s-card" style="box-shadow:0 1px 4px rgba(0,0,0,0.06);">sm</div>
  <div class="s-card" style="box-shadow:0 2px 8px rgba(44,74,103,0.08);">card</div>
  <div class="s-card" style="box-shadow:0 8px 28px rgba(44,74,103,0.14);">hover</div>
  <div class="s-card" style="box-shadow:0 8px 32px rgba(0,0,0,0.10);">lg</div>
</div>
</body>
</html>
