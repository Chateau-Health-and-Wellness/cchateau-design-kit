<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-page); margin: 0; padding: 20px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--neutral-300); padding: 10px 0; }
  .row:last-child { border-bottom: none; }
  .meta { width: 80px; flex-shrink: 0; }
  .meta-tag { font-family: Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--neutral-500); }
  .meta-size { font-family: monospace; font-size: 10px; color: var(--neutral-300); }
</style>
</head>
<body>
  <div class="row">
    <div class="meta"><div class="meta-tag">H1</div><div class="meta-size">48px / 400</div></div>
<h1 style="margin:0;">Healing Begins Here</h1>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-tag">H2</div><div class="meta-size">36px / 400</div></div>
<h2 style="margin:0;">Evidence-Based Treatment</h2>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-tag">H3</div><div class="meta-size">28px / 400</div></div>
<h3 style="margin:0;">Trauma-Informed Care</h3>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-tag">H4</div><div class="meta-size">24px / 700</div></div>
<h4 style="margin:0; font-family: 'EB Garamond', serif; font-weight:500;">Residential Programs</h4>
  </div>
</body>
</html>
