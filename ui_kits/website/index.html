<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chateau Health & Wellness — Website UI Kit</title>
<style>
@font-face { font-family:'EB Garamond'; src:url('../../fonts/EBGaramond-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'EB Garamond'; src:url('../../fonts/EBGaramond-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:swap; }
@font-face { font-family:'EB Garamond'; src:url('../../fonts/EBGaramond-Medium.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
@font-face { font-family:'EB Garamond'; src:url('../../fonts/EBGaramond-SemiBold.ttf') format('truetype'); font-weight:600; font-style:normal; font-display:swap; }
@font-face { font-family:'EB Garamond'; src:url('../../fonts/EBGaramond-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand-primary: #3B5A66;
    --brand-primary-dark: #2C4851;
    --brand-secondary: #50717A;
    --brand-secondary-dark: #354B51;
    --accent: #D17400;
    --accent-bright: #E17100;
    --neutral-950: #181A21;
    --neutral-900: #303442;
    --neutral-700: #626571;
    --neutral-500: #9295A1;
    --neutral-300: #C2C5D0;
    --bg-page: #FFFFFF;
    --bg-warm: #FFFFFF;
    --bg-card: #FFFFFF;
    --alert-red: #D50000;
    --success-green: #0AA29E;
    --font-serif: 'EB Garamond', Georgia, serif;
    --font-sans: Arial, 'Helvetica Neue', sans-serif;
  }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body { font-family: var(--font-sans); background: var(--bg-page); color: var(--neutral-700); }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="TrustBar.jsx"></script>
<script type="text/babel" src="CinematicSections.jsx"></script>
<script type="text/babel" src="ProgramCards.jsx"></script>
<script type="text/babel" src="FRSpotlight.jsx"></script>
<script type="text/babel" src="StatsSection.jsx"></script>
<script type="text/babel" src="InsuranceBar.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [page, setPage] = useState(() => sessionStorage.getItem('chateau-page') || 'home');
  const navigate = (p) => { setPage(p); sessionStorage.setItem('chateau-page', p); window.scrollTo(0,0); };

  return (
    <div>
      <SiteNav navigate={navigate} page={page} />
      {page === 'home' && <>
        <SiteHero navigate={navigate} />
        <SiteTrustBar />
        <WhoWeServe navigate={navigate} />
        <WhyChateau />
        <SitePrograms navigate={navigate} />
        <SiteFRSpotlight navigate={navigate} />
        <SiteStats />
        <OurApproach navigate={navigate} />
        <SiteInsuranceBar navigate={navigate} />
        <SiteFooter navigate={navigate} />
      </>}
      {page === 'fr' && <FRPage navigate={navigate} />}
      {page === 'admissions' && <AdmissionsPage navigate={navigate} />}
      {page === 'programs' && <ProgramsPage navigate={navigate} />}
    </div>
  );
}

/* ── Who We Serve ── */
function WhoWeServe({ navigate }) {
  const items = [
    { icon: '⬡', title: 'First Responders', desc: 'Specialized tracks for officers, firefighters, EMS, and dispatchers.', link: 'fr' },
    { icon: '⬡', title: 'Veterans & Military', desc: 'Combat trauma, MST, and transition support from clinicians who understand service.', link: 'fr' },
    { icon: '⬡', title: 'Professionals 26+', desc: 'Discreet, high-quality care for working adults who need to protect their careers.', link: 'programs' },
    { icon: '⬡', title: 'Trauma Survivors', desc: 'Evidence-based trauma treatment including EMDR, CPT, and somatic therapies.', link: 'programs' },
  ];
  return (
    <section style={{ background: 'var(--bg-page)', padding: '80px 40px' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <span style={labelStyle}>WHO WE SERVE</span>
        <h2 style={h2Style}>Specialized care for those who need it most</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 20, marginTop: 40 }}>
          {items.map(item => (
            <div key={item.title} onClick={() => navigate(item.link)}
              style={{ background: '#ffffff', borderRadius: 8, padding: 24, cursor: 'pointer',
                boxShadow: '0 2px 8px rgba(44,74,103,0.08)', borderTop: '3px solid var(--brand-secondary)',
                transition: 'transform 0.2s, box-shadow 0.2s' }}
              onMouseEnter={e => { e.currentTarget.style.transform='translateY(-4px)'; e.currentTarget.style.boxShadow='0 8px 28px rgba(44,74,103,0.14)'; }}
              onMouseLeave={e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow='0 2px 8px rgba(44,74,103,0.08)'; }}>
              <div style={{ width:40, height:40, borderRadius:8, background:'var(--brand-secondary)', display:'flex', alignItems:'center', justifyContent:'center', marginBottom:12 }}>
                <IconShield />
              </div>
              <div style={{ fontFamily:'var(--font-sans)', fontWeight:700, fontSize:16, color:'var(--neutral-900)', marginBottom:6 }}>{item.title}</div>
              <div style={{ fontSize:14, color:'var(--neutral-700)', lineHeight:1.55 }}>{item.desc}</div>
              <div style={{ marginTop:10, fontSize:12, fontWeight:700, color:'var(--brand-secondary)', letterSpacing:'0.04em' }}>Learn more →</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ── Why Chateau ── */
/* ── Why Chateau — Cinematic Split ── */
function WhyChateau() {
  return (
    <CinematicSplit
      img="facility-commons.webp"
      eyebrow="Why Chateau"
      title="What makes us different"
      bullets={[
        'First responder-specific treatment tracks, culturally competent clinicians, peer support specialists, and career-preservation confidentiality.',
        '12+ evidence-based modalities, 8 experiential therapies, individualized treatment plans, and outcome tracking from day one.',
        '14-bed boutique facility in the Wasatch Mountains — distance from triggers, equine therapy, outdoor recreation, and true serenity.',
        'Joint Commission Gold Seal. FOP Approved Wellness Provider. 4.8/5 on Google from 154 verified reviews. Since 2012.',
      ]}
      cta="Explore Our Approach"
    />
  );
}

/* ── Our Approach — Cinematic Full Bleed ── */
function OurApproach({ navigate }) {
  return (
    <CinematicFullBleed
      img="facility-outdoor.webp"
      number="Our Approach"
      title="Evidence-based, whole-person treatment"
      subtitle="Healing the whole self"
      sections={[
        {
          heading: 'Proven Modalities',
          body: 'We treat the whole person — not just the diagnosis. Our clinical team tailors every treatment plan using modalities proven to work for trauma, PTSD, and substance use.',
          bullets: ['EMDR · CBT · DBT · Somatic Therapy','Equine Therapy · Art Therapy · Mindfulness','Family Therapy · IFS · CPT · Psychodrama'],
          link: 'Learn More: Our Clinical Approach',
        },
        {
          heading: 'The Wasatch Mountain Setting',
          body: 'Distance from daily triggers combined with nature-immersive therapy creates a healing environment unlike any clinical facility.',
          link: 'Learn More: Our Facility',
        },
      ]}
      onLearnMore={() => navigate('programs')}
    />
  );
}

/* ── FR Page ── */
function FRPage({ navigate }) {
  const professions = ['Police & Law Enforcement','Firefighters','Military & Veterans','EMS & Paramedics','Dispatchers & 911','Corrections Officers','Nurses'];
  return (
    <div>
      <div style={{ position:'relative', height:380, overflow:'hidden' }}>
        <div style={{ position:'absolute', inset:0, background:`url('../../assets/team-outdoor.webp') center/cover` }}></div>
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(105deg, rgba(24,26,33,0.92) 0%, rgba(24,26,33,0.78) 35%, rgba(24,26,33,0.30) 65%, rgba(24,26,33,0.05) 100%)' }}></div>
        {/* Section-top orange bar RETIRED. Small rule sits above the H1 (below). */}
        <div style={{ position:'relative', zIndex:2, padding:'80px 40px', maxWidth:800 }}>
          <span style={{ ...labelStyle, color:'rgba(255,255,255,0.7)' }}>FIRST RESPONDERS</span>
          <span aria-hidden="true" style={{ display:'block', width:32, height:3, background:'linear-gradient(90deg,#D17400,#E17100)', borderRadius:2, marginTop:8, marginBottom:8 }}></span>
          <h1 style={{ fontFamily:'var(--font-serif)', fontSize:44, fontWeight:400, color:'#fff', lineHeight:1.2 }}>Dedicated programs for those who serve</h1>
          <p style={{ color:'rgba(255,255,255,0.8)', fontSize:17, marginTop:14, maxWidth:560 }}>We understand the unique culture, stressors, and stigma that first responders face. Our programs are built around your world.</p>
          <div style={{ display:'flex', gap:12, marginTop:28 }}>
            <button onClick={() => navigate('admissions')} style={btnPrimary}>Get Confidential Help</button>
            <button onClick={() => navigate('admissions')} style={btnGhost}>Verify Insurance</button>
          </div>
        </div>
      </div>
      <div style={{ background:'#ffffff', padding:'64px 40px' }}>
        <div style={{ maxWidth:1100, margin:'0 auto' }}>
          <span style={labelStyle}>PROFESSION-SPECIFIC PROGRAMS</span>
          <h2 style={h2Style}>Your profession. Your program.</h2>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16, marginTop:36 }}>
            {professions.map(p => (
              <div key={p} onClick={() => navigate('admissions')} style={{ background:'var(--bg-card)', borderRadius:8, padding:'20px 22px', cursor:'pointer', boxShadow:'0 2px 8px rgba(44,74,103,0.08)', display:'flex', alignItems:'center', gap:12, transition:'transform 0.2s' }}
                onMouseEnter={e=>e.currentTarget.style.transform='translateY(-3px)'}
                onMouseLeave={e=>e.currentTarget.style.transform=''}>
                <div style={{ width:36, height:36, borderRadius:8, background:'var(--brand-secondary)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}><IconShield /></div>
                <span style={{ fontWeight:700, fontSize:14, color:'var(--neutral-900)' }}>{p}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Admissions Page ── */
function AdmissionsPage({ navigate }) {
  const [step, setStep] = useState(1);
  const [fr, setFr] = useState('');
  const [insurance, setInsurance] = useState('');
  const [submitted, setSubmitted] = useState(false);

  return (
    <div style={{ background:'var(--bg-page)', minHeight:'80vh', padding:'60px 40px' }}>
      <div style={{ maxWidth:600, margin:'0 auto' }}>
        <span style={labelStyle}>ADMISSIONS</span>
        <h1 style={{ fontFamily:'var(--font-serif)', fontSize:40, fontWeight:400, color:'var(--neutral-900)', marginTop:8, marginBottom:8 }}>Verify your insurance coverage</h1>
        <p style={{ color:'var(--neutral-700)', marginBottom:36 }}>Find out if your treatment is covered — it only takes 2 minutes. 100% confidential.</p>
        {/* Progress */}
        <div style={{ display:'flex', alignItems:'center', gap:0, marginBottom:40 }}>
          {[1,2,3,4].map((s,i) => (
            <React.Fragment key={s}>
              <div style={{ width:32, height:32, borderRadius:'50%', background: step>=s ? 'var(--brand-primary)' : 'var(--neutral-300)', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:13, flexShrink:0 }}>{s}</div>
              {i<3 && <div style={{ flex:1, height:3, background: step>s ? 'var(--brand-primary)' : 'var(--neutral-300)' }}></div>}
            </React.Fragment>
          ))}
        </div>
        {!submitted ? (
          <div style={{ background:'var(--bg-card)', borderRadius:12, padding:32, boxShadow:'0 2px 12px rgba(44,74,103,0.10)' }}>
            {step===1 && (
              <div>
                <h3 style={{ fontFamily:'var(--font-serif)', fontSize:24, color:'var(--neutral-900)', marginBottom:20 }}>Insurance information</h3>
                <label style={fldLabel}>Insurance Provider</label>
                <select value={insurance} onChange={e=>setInsurance(e.target.value)} style={fldInput}>
                  <option value="">Select provider...</option>
                  {['Aetna','BlueCross BlueShield','Cigna','ComPsych','GEHA','Humana','Magellan','Select Health','Tricare','UnitedHealthcare','Other'].map(p=><option key={p}>{p}</option>)}
                </select>
                <label style={{ ...fldLabel, marginTop:16 }}>Member/Subscriber ID</label>
                <input style={fldInput} placeholder="e.g. XYZ123456789" />
                <label style={{ ...fldLabel, marginTop:16 }}>Group Number <span style={{ fontWeight:400, color:'var(--neutral-500)' }}>(optional)</span></label>
                <input style={fldInput} placeholder="Optional" />
              </div>
            )}
            {step===2 && (
              <div>
                <h3 style={{ fontFamily:'var(--font-serif)', fontSize:24, color:'var(--neutral-900)', marginBottom:20 }}>Your information</h3>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
                  <div><label style={fldLabel}>First Name</label><input style={fldInput} placeholder="First" /></div>
                  <div><label style={fldLabel}>Last Name</label><input style={fldInput} placeholder="Last" /></div>
                </div>
                <label style={{ ...fldLabel, marginTop:16 }}>Date of Birth</label>
                <input style={fldInput} type="date" />
                <label style={{ ...fldLabel, marginTop:16 }}>Phone Number</label>
                <input style={fldInput} placeholder="(435) 000-0000" />
                <label style={{ ...fldLabel, marginTop:16 }}>Email Address</label>
                <input style={fldInput} placeholder="you@email.com" />
              </div>
            )}
            {step===3 && (
              <div>
                <h3 style={{ fontFamily:'var(--font-serif)', fontSize:24, color:'var(--neutral-900)', marginBottom:20 }}>Treatment interest</h3>
                <label style={fldLabel}>What are you seeking help for? (select all that apply)</label>
                {['Trauma / PTSD','Substance Use','Mental Health','Dual Diagnosis','Not Sure'].map(o => (
                  <label key={o} style={{ display:'flex', alignItems:'center', gap:10, marginTop:10, fontSize:15, color:'var(--neutral-700)', cursor:'pointer' }}>
                    <input type="checkbox" style={{ width:18, height:18, accentColor:'var(--brand-primary)' }} /> {o}
                  </label>
                ))}
                <label style={{ ...fldLabel, marginTop:20 }}>Are you a first responder or veteran?</label>
                <div style={{ display:'flex', gap:12, marginTop:8 }}>
                  {['Yes','No'].map(o => (
                    <button key={o} onClick={()=>setFr(o)} style={{ padding:'10px 24px', borderRadius:9999, border:`2px solid ${fr===o?'var(--brand-primary)':'var(--neutral-300)'}`, background:fr===o?'var(--brand-primary)':'transparent', color:fr===o?'#fff':'var(--neutral-700)', fontWeight:700, cursor:'pointer', transition:'all 0.15s' }}>{o}</button>
                  ))}
                </div>
              </div>
            )}
            {step===4 && (
              <div style={{ textAlign:'center', padding:'20px 0' }}>
                <div style={{ width:60, height:60, borderRadius:'50%', background:'var(--success-green)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px' }}>
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <h3 style={{ fontFamily:'var(--font-serif)', fontSize:26, color:'var(--neutral-900)', marginBottom:10 }}>We'll be in touch within 2 hours</h3>
                <p style={{ color:'var(--neutral-700)', lineHeight:1.65 }}>A member of our admissions team will contact you during business hours. For immediate assistance, call <strong>(435) 222-5225</strong>.</p>
              </div>
            )}
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:28 }}>
              {step>1 && step<4 && <button onClick={()=>setStep(s=>s-1)} style={{ ...btnSecondary }}>Back</button>}
              {step===1 && <div></div>}
              {step<4 && <button onClick={()=>setStep(s=>s+1)} style={{ ...btnPrimary }}>Continue</button>}
              {step===4 && <button onClick={()=>navigate('home')} style={{ ...btnPrimary, margin:'0 auto' }}>Back to Home</button>}
            </div>
          </div>
        ) : null}
        <div style={{ marginTop:24, textAlign:'center', color:'var(--neutral-500)', fontSize:13 }}>
          <svg style={{ verticalAlign:'middle', marginRight:6 }} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          100% Confidential · HIPAA Compliant
        </div>
      </div>
    </div>
  );
}

/* ── Programs Page ── */
function ProgramsPage({ navigate }) {
  const programs = [
    { name:'Residential Treatment', desc:'Our flagship program — full-time therapeutic immersion in the Wasatch Mountains. 30–90 day stays.', img:'facility-commons' },
    { name:'Trauma & PTSD', desc:'Specialized protocol using EMDR, CPT, somatic therapy, and equine therapy for trauma survivors.', img:'facility-therapy-office' },
    { name:'Mental Health', desc:'Comprehensive treatment for depression, anxiety, OCD, and co-occurring mood disorders.', img:'facility-bedroom' },
    { name:'Substance Use', desc:'Medically supervised detox + residential treatment for alcohol, opioids, stimulants, and more.', img:'facility-hallway' },
    { name:'Dual Diagnosis', desc:'Integrated care for clients with co-occurring mental health and substance use diagnoses.', img:'facility-entrance' },
  ];
  return (
    <div style={{ background:'var(--bg-page)', minHeight:'80vh' }}>
      <div style={{ background:'var(--brand-primary)', padding:'64px 40px 48px' }}>
        <div style={{ maxWidth:900, margin:'0 auto' }}>
          <span style={{ ...labelStyle, color:'rgba(255,255,255,0.7)' }}>PROGRAMS</span>
          <span aria-hidden="true" style={{ display:'block', width:32, height:3, background:'linear-gradient(90deg,#D17400,#E17100)', borderRadius:2, marginTop:8, marginBottom:8 }}></span>
          <h1 style={{ fontFamily:'var(--font-serif)', fontSize:44, fontWeight:400, color:'#fff' }}>Comprehensive treatment programs</h1>
          <p style={{ color:'rgba(255,255,255,0.7)', fontSize:17, marginTop:12, maxWidth:600 }}>Each program is clinically rigorous, individually tailored, and delivered in a boutique mountain setting unlike any institutional facility.</p>
        </div>
      </div>
      <div style={{ padding:'60px 40px', maxWidth:1100, margin:'0 auto' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }}>
          {programs.map(p => (
            <div key={p.name} onClick={()=>navigate('admissions')} style={{ background:'var(--bg-card)', borderRadius:10, overflow:'hidden', boxShadow:'0 2px 8px rgba(44,74,103,0.08)', cursor:'pointer', transition:'transform 0.2s, box-shadow 0.2s' }}
              onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='0 8px 28px rgba(44,74,103,0.14)';}}
              onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='0 2px 8px rgba(44,74,103,0.08)';}}>
              <div style={{ height:140, background:`url('../../assets/${p.img}.webp') center/cover`, position:'relative' }}>
                <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, rgba(24,26,33,0.72) 0%, rgba(24,26,33,0.15) 55%, transparent 100%)' }}></div>
              </div>
              <div style={{ padding:'20px 24px' }}>
                <div style={{ fontFamily:'var(--font-serif)', fontSize:22, color:'var(--neutral-900)', marginBottom:8 }}>{p.name}</div>
                <p style={{ fontSize:14, color:'var(--neutral-700)', lineHeight:1.6 }}>{p.desc}</p>
                <div style={{ marginTop:12, fontSize:12, fontWeight:700, color:'var(--brand-secondary)', letterSpacing:'0.04em' }}>Learn more →</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Icons ── */
function IconShield() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
}

/* ── Shared Styles ── */
const labelStyle = { display:'block', fontFamily:'Arial,sans-serif', fontSize:14, fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--brand-secondary)', marginBottom:8 };
const h2Style = { fontFamily:'var(--font-serif)', fontSize:36, fontWeight:400, color:'var(--neutral-900)', lineHeight:1.25, marginTop:6 };
const btnPrimary = { background:'#3B5A66', color:'#fff', border:'2px solid #3B5A66', borderRadius:9999, padding:'13px 30px', fontFamily:"'EB Garamond', Georgia, serif", fontStyle:'italic', fontWeight:400, fontSize:17, letterSpacing:'0.01em', cursor:'pointer', transition:'background 0.2s, transform 0.2s', whiteSpace:'nowrap' };
const btnSecondary = { background:'transparent', color:'#3B5A66', border:'2px solid #3B5A66', borderRadius:9999, padding:'13px 30px', fontFamily:"'EB Garamond', Georgia, serif", fontStyle:'italic', fontWeight:400, fontSize:17, letterSpacing:'0.01em', cursor:'pointer', transition:'all 0.2s' };
const btnGhost = { background:'transparent', color:'rgba(255,255,255,0.88)', border:'2px solid rgba(255,255,255,0.55)', borderRadius:9999, padding:'13px 30px', fontFamily:"'EB Garamond', Georgia, serif", fontStyle:'italic', fontWeight:400, fontSize:17, letterSpacing:'0.01em', cursor:'pointer' };
const fldLabel = { display:'block', fontFamily:'Arial,sans-serif', fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', color:'var(--neutral-500)', marginBottom:6 };
const fldInput = { width:'100%', padding:'11px 14px', border:'1px solid var(--neutral-300)', borderRadius:6, fontFamily:'Arial,sans-serif', fontSize:15, color:'var(--neutral-900)', background:'#fff', outline:'none' };

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
